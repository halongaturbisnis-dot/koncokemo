<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KoncoKemo adalah Pusat Informasi Pasien Kemoterapi. Membantu pasien memantau kondisi kesehatan mandiri pasca-kandungan/kanker dan terapi secara terpadu." />
    <meta name="theme-color" content="#815ac1" />
    
    <!-- Meta PWA / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KoncoKemo" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/13A59jDQDvXFFvrpe9uvTdlusw3OKGM44" />
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/13A59jDQDvXFFvrpe9uvTdlusw3OKGM44" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>KoncoKemo - Pusat Informasi Pasien Kemoterapi</title>
  </head>
  <body>
    <div id="root">
      <style>
        .pre-splash {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }
        .pre-logo {
          width: 64px;
          height: 64px;
          animation: logo-pulse 1.5s ease-in-out infinite;
        }
        @keyframes logo-pulse {
          0% { transform: scale(0.9); opacity: 0.5; }
          50% { transform: scale(1); opacity: 1; }
          100% { transform: scale(0.9); opacity: 0.5; }
        }
      </style>
      <div class="pre-splash">
        <img src="/logo-transparent.png" class="pre-logo" alt="KoncoKemo" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully!', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
